name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================
  # CI - Build and Test
  # =========================

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout repository
      # =========================

      - name: Checkout code
        uses: actions/checkout@v4


      # =========================
      # 2. Setup Python
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =========================
      # 3. Install dependencies
      # =========================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =========================
      # 4. Run tests
      # =========================

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            python -m pytest
          else
            echo "No tests directory found. Skipping tests."
          fi


      # =========================
      # 5. Setup Docker Buildx
      # =========================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # =========================
      # 6. Login to Docker Hub
      # =========================

      - name: Login to Docker Hub
        if: github.event_name == 'push'

        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # =========================
      # 7. Build Docker Image
      # =========================

      - name: Build Docker image
        uses: docker/build-push-action@v6

        with:
          context: .
          platforms: linux/amd64

          # Load image into GitHub runner
          # so we can test it before pushing
          load: true

          push: false

          tags: |
            dpneoigi/email-automator:${{ github.sha }}
            dpneoigi/email-automator:latest


      # =========================
      # 8. Run Docker Container
      # =========================

      - name: Run Docker container
        run: |
          docker run -d \
            --name email-automator-test \
            -p 8080:8080 \
            -e API_KEY="ci-test-api-key" \
            -e PUBSUB_TOKEN="ci-test-pubsub-token" \
            -e OAUTH_REDIRECT_URI="http://localhost/auth/google/callback" \
            dpneoigi/email-automator:${{ github.sha }}


      # =========================
      # 9. Wait for Application
      # =========================

      - name: Wait for application startup
        run: |
          echo "Waiting for application..."
          sleep 10


      # =========================
      # 10. Check Container Status
      # =========================

      - name: Check container status
        run: |
          docker ps -a
          docker inspect email-automator-test \
            --format='{{.State.Status}}'


      # =========================
      # 11. Health Check
      # =========================

      - name: Check application health
        run: |
          curl --fail \
            --max-time 10 \
            http://127.0.0.1:8080/health


      # =========================
      # 12. Show Logs if CI Fails
      # =========================

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "========== CONTAINER LOGS =========="
          docker logs email-automator-test || true


      # =========================
      # 13. Cleanup Test Container
      # =========================

      - name: Cleanup test container
        if: always()
        run: |
          docker stop email-automator-test || true
          docker rm email-automator-test || true


      # =========================
      # 14. Push Docker Image
      # =========================

      - name: Push Docker image
        if: github.event_name == 'push'

        run: |
          docker push dpneoigi/email-automator:${{ github.sha }}
          docker push dpneoigi/email-automator:latest


  # =========================
  # CD - Deploy to VM
  # =========================

  deploy:

    needs: build

    # Deploy only on push to main
    if: github.event_name == 'push'

    runs-on: ubuntu-latest


    steps:

      # =========================
      # Deploy to VM
      # =========================

      - name: Deploy to VM

        uses: appleboy/ssh-action@v1.2.2

        env:
          API_KEY: ${{ secrets.API_KEY }}
          PUBSUB_TOKEN: ${{ secrets.PUBSUB_TOKEN }}

        with:

          host: ${{ secrets.VM_HOST }}

          username: ${{ secrets.VM_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          envs: API_KEY,PUBSUB_TOKEN

          script: |

            # =========================
            # Docker Image
            # =========================

            IMAGE=dpneoigi/email-automator:${{ github.sha }}

            echo "Deploying image: $IMAGE"


            # =========================
            # Pull New Image
            # =========================

            echo "Pulling new Docker image..."

            docker pull $IMAGE


            # =========================
            # Stop Old Container
            # =========================

            echo "Stopping old container..."

            docker stop email-automator || true


            # =========================
            # Remove Old Container
            # =========================

            echo "Removing old container..."

            docker rm email-automator || true


            # =========================
            # Start New Container
            # =========================

            echo "Starting new container..."

            docker run -d \
              --name email-automator \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -v /home/d_neogi_coding/secrets/credentials.json:/app/credentials.json:ro \
              -v email_automator_data:/data \
              --env-file /home/d_neogi_coding/secrets/email-automator.env \
              -e API_KEY="$API_KEY" \
              -e PUBSUB_TOKEN="$PUBSUB_TOKEN" \
              -e OAUTH_REDIRECT_URI="https://daipayan0p.dev/auth/google/callback" \
              $IMAGE


            # =========================
            # Wait for Application
            # =========================

            echo "Waiting for application..."

            sleep 10


            # =========================
            # Check Container Status
            # =========================

            echo "Checking Docker container..."

            docker ps | grep email-automator


            # =========================
            # Health Check
            # =========================

            echo "Checking application health..."

            curl --fail \
              --max-time 10 \
              http://127.0.0.1:8080/health


            echo "Deployment successful!"


            # =========================
            # Docker Cleanup
            # =========================

            docker image prune -f