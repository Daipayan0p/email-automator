name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app scripts

      - name: Import application and verify routes
        env:
          DATABASE_FILE: /tmp/email-automator-test.db
        run: |
          python -c "from app.main import app; paths = {route.path for route in app.routes}; required = {'/health', '/search', '/pubsub', '/auth/google/login', '/auth/google/callback'}; assert required <= paths"

  container:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag email-automator:test .
